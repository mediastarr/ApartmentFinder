<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=600, height=600, initial-scale=1, user-scalable=no">
<title>Rent Walk</title>
<style>
:root{
  --cyan:#00e5ff;
  --cyan-soft:rgba(0,229,255,.32);
  --ink:#e9fbff;
  --dim:#86aab4;
  --panel:rgba(4,13,19,.9);
  --amber:#ffb224;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;background:#000;color:var(--ink);overflow:hidden;
  font-family:-apple-system,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-user-select:none;user-select:none}
body{display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:min(100vw,600px);height:min(100vh,600px);background:#000;overflow:hidden}
@media (min-width:640px) and (min-height:640px){#stage{outline:1px dashed rgba(0,229,255,.25)}}

/* ---------- status row ---------- */
#hud{position:absolute;top:12px;left:16px;right:16px;display:flex;justify-content:space-between;gap:8px;z-index:5}
.chip{display:flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:17px;
  background:var(--panel);border:1px solid var(--cyan-soft);font-size:17px;font-weight:600;letter-spacing:.2px;white-space:nowrap}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.chip.warn{border-color:rgba(255,178,36,.5);color:var(--amber)}
.chip.warn .dot{background:var(--amber);box-shadow:0 0 8px var(--amber)}
.chip.pulse .dot{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}

/* ---------- empty / scanning ---------- */
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;
  text-align:center;padding:0 60px;z-index:2;transition:opacity .3s}
#empty.gone{opacity:0;pointer-events:none}
#empty .ring{width:92px;height:92px;border-radius:50%;border:2px solid var(--cyan-soft);position:relative}
#empty .ring::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid transparent;border-top-color:var(--cyan);animation:spin 1.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#emptyTxt{font-size:24px;line-height:1.35;color:var(--dim)}
#emptyTxt b{color:var(--ink);font-weight:600}

/* ---------- card ---------- */
#card{position:absolute;left:16px;right:16px;bottom:16px;height:352px;display:flex;flex-direction:column;overflow:hidden;
  background:var(--panel);border:1px solid var(--cyan-soft);border-radius:26px;outline:none;
  box-shadow:0 0 0 1px rgba(0,229,255,.06),0 0 28px rgba(0,229,255,.14);
  transition:height .32s var(--ease),opacity .25s,transform .25s var(--ease);z-index:3}
#card.hide{opacity:0;transform:translateY(24px);pointer-events:none}
#card.exp{height:528px}
#card.in{animation:cardIn .34s var(--ease)}
@keyframes cardIn{from{opacity:.0;transform:translateY(18px)}to{opacity:1;transform:none}}
#card.bumpy{animation:bumpy .22s ease-out}
@keyframes bumpy{40%{transform:translateY(-7px)}}
#card.bumpx #media{animation:bumpx .22s ease-out}
@keyframes bumpx{40%{transform:translateX(-7px)}}
#card.bumpx.rev #media{animation-name:bumpxr}
@keyframes bumpxr{40%{transform:translateX(7px)}}

#media{position:relative;height:184px;flex:none;background:#03090d;transition:height .32s var(--ease)}
#card.exp #media{height:132px}
#track{display:flex;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;
  touch-action:pan-x;overscroll-behavior:contain;outline:none}
#track::-webkit-scrollbar{display:none}
.slide{position:relative;flex:0 0 100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;background:#03090d}
.slide img,.slide video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.slide.bad::after{content:"Video unavailable";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.6);color:var(--dim);font-size:20px}
.cap{position:absolute;left:12px;bottom:12px;padding:4px 12px;border-radius:14px;background:rgba(0,0,0,.62);font-size:16px;font-weight:600}
.badge{position:absolute;top:12px;right:12px;display:flex;align-items:center;gap:8px;padding:5px 12px;border-radius:15px;
  background:rgba(0,0,0,.66);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.badge.vid{color:#001014;background:var(--cyan)}
.badge svg{width:12px;height:12px}
#dots{position:absolute;bottom:12px;right:12px;display:flex;gap:6px}
#dots i{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.35);transition:width .2s,background .2s}
#dots i.on{width:22px;background:var(--cyan)}

#body{flex:1;min-height:0;display:flex;flex-direction:column;padding:12px 18px 0;touch-action:none}
#sum .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.price{font-size:40px;font-weight:700;line-height:1.05;color:var(--cyan);font-variant-numeric:tabular-nums;letter-spacing:-.5px;
  text-shadow:0 0 14px rgba(0,229,255,.35)}
.price small{font-size:20px;font-weight:500;color:var(--dim);margin-left:4px;letter-spacing:0}
.where{display:flex;align-items:center;gap:12px;text-align:right}
.where .txt{line-height:1.15}
.where b{display:block;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.where em{font-style:normal;font-size:16px;color:var(--dim)}
.compass{width:52px;height:52px;border-radius:50%;border:2px solid var(--cyan);display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 14px rgba(0,229,255,.35),inset 0 0 10px rgba(0,229,255,.15);flex:none}
.compass svg{width:28px;height:28px;color:var(--cyan);transition:transform .35s var(--ease)}
.specs{display:flex;gap:16px;margin-top:6px;font-size:21px;font-weight:600;align-items:baseline}
.specs span+span{padding-left:16px;border-left:1px solid var(--cyan-soft)}
.specs .t{color:var(--dim);font-weight:500}
.addr{margin-top:3px;font-size:19px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#details{display:none;flex:1;min-height:0;overflow-y:auto;margin-top:10px;padding-bottom:16px;touch-action:pan-y;scrollbar-width:none;
  border-top:1px solid var(--cyan-soft)}
#details::-webkit-scrollbar{display:none}
#card.exp #details{display:block}
#details h3{font-size:22px;font-weight:700;margin:12px 0 8px}
#details p{font-size:19px;line-height:1.4;color:#cfe7ee}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-top:2px}
.grid div{font-size:18px;line-height:1.25}
.grid div span{display:block;font-size:15px;color:var(--dim)}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.tags i{font-style:normal;font-size:17px;padding:5px 12px;border-radius:15px;border:1px solid var(--cyan-soft);background:rgba(0,229,255,.06)}
.contact{margin-top:14px;padding:12px 14px;border-radius:16px;background:rgba(0,229,255,.08);border:1px solid var(--cyan-soft);font-size:19px}
.contact span{display:block;font-size:15px;color:var(--dim)}

#hint{flex:none;height:38px;display:flex;justify-content:space-around;align-items:center;
  border-top:1px solid rgba(0,229,255,.16);font-size:16px;color:var(--dim)}
#hint b{color:var(--cyan);font-weight:700;margin-right:5px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="stage">
  <div id="hud">
    <div class="chip pulse warn" id="gps"><i class="dot"></i><span id="gpsTxt">Locating</span></div>
    <div class="chip" id="mode"><i class="dot"></i><span id="modeTxt">Auto</span></div>
    <div class="chip" id="count"><span id="countTxt">0 nearby</span></div>
  </div>

  <div id="empty"><div class="ring"></div><div id="emptyTxt">Finding your location…</div></div>

  <section id="card" class="hide" tabindex="0" aria-live="polite">
    <div id="media">
      <div id="track" tabindex="0"></div>
      <div class="badge" id="badge"></div>
      <div id="dots"></div>
    </div>
    <div id="body">
      <div id="sum"></div>
      <div id="details" tabindex="0"></div>
    </div>
    <div id="hint"></div>
  </section>
</div>

<script>
/* =====================================================================
   Rent Walk — walking-distance rental explorer
   Target: Meta Ray-Ban Display (600x600, Neural Band input)

   Gesture map (Neural Band arrives as arrow keys / Enter, or click):
     swipe left / right  -> previous / next photo or video
     swipe up / down     -> next / previous listing (scrolls details when open)
     pinch               -> open / close full details
     back                -> close details, or return to auto-follow

   Plug in real listings: set CONFIG.API_URL (or ?api=https://.../listings).
   The endpoint receives ?lat=&lng=&radius=<meters> and returns
     { "listings": [ {
         "id":"abc", "title":"Sunlit 1BR", "address":"12 Elm St",
         "lat":42.35, "lng":-71.07, "price":3200,
         "beds":1, "baths":1, "sqft":700, "type":"Apartment",
         "available":"Oct 1", "lease":"12 mo", "deposit":"1 mo",
         "pets":"Cats OK", "laundry":"In-unit", "floor":"3", "parking":"Street",
         "description":"...", "amenities":["Dishwasher","Roof deck"],
         "contact":{"name":"Maya R.","phone":"(555) 010-2290"},
         "media":[ {"type":"photo","src":"https://...","label":"Living room"},
                   {"type":"video","src":"https://...mp4","poster":"https://...","label":"Tour"} ]
     } ] }
   Only id, lat, lng, price are required; everything else is optional.
   ===================================================================== */
(()=>{
'use strict';

const Q=new URLSearchParams(location.search);
const CONFIG={
  API_URL:Q.get('api')||'',            // '' = built-in demo listings
  RADIUS_M:+(Q.get('r')||180),         // how close counts as "nearby"
  FETCH_RADIUS_M:800,                  // area requested from the API
  REFETCH_M:200,                       // re-query after moving this far
  HYSTERESIS_M:15,                     // avoid flip-flopping between two similar listings
  LOCK_MS:20000,                       // manual browsing returns to auto-follow after this idle time
  SIM_SPEED_MPS:5,                     // simulated walk speed (demo fast-forward)
  SIM_START:{lat:+(Q.get('lat')||40.7411),lng:+(Q.get('lng')||-73.9897)},
  FORCE_SIM:Q.get('sim')==='1'
};

const $=id=>document.getElementById(id);
const el={gps:$('gps'),gpsTxt:$('gpsTxt'),mode:$('mode'),modeTxt:$('modeTxt'),count:$('count'),countTxt:$('countTxt'),
  empty:$('empty'),emptyTxt:$('emptyTxt'),card:$('card'),track:$('track'),badge:$('badge'),dots:$('dots'),
  sum:$('sum'),details:$('details'),hint:$('hint')};

/* ---------- geo helpers ---------- */
const R=6371000, rad=d=>d*Math.PI/180, deg=r=>r*180/Math.PI;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function dist(a,b,c,d){const p=rad(c-a),q=rad(d-b);
  const x=Math.sin(p/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(q/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function bearing(a,b,c,d){const y=Math.sin(rad(d-b))*Math.cos(rad(c));
  const x=Math.cos(rad(a))*Math.sin(rad(c))-Math.sin(rad(a))*Math.cos(rad(c))*Math.cos(rad(d-b));
  return (deg(Math.atan2(y,x))+360)%360;}
function offset(lat,lng,brg,m){const dr=m/R,b=rad(brg),la=rad(lat),lo=rad(lng);
  const la2=Math.asin(Math.sin(la)*Math.cos(dr)+Math.cos(la)*Math.sin(dr)*Math.cos(b));
  const lo2=lo+Math.atan2(Math.sin(b)*Math.sin(dr)*Math.cos(la),Math.cos(dr)-Math.sin(la)*Math.sin(la2));
  return {lat:deg(la2),lng:deg(lo2)};}
const blendAngle=(a,b,t)=>{const d=((b-a+540)%360)-180;return (a+d*t+360)%360;};
const fmtDist=m=>{const ft=m*3.28084;return ft<1000?Math.max(10,Math.round(ft/10)*10)+' ft':(m/1609.34).toFixed(1)+' mi';};
const cardinal=b=>['north','northeast','east','southeast','south','southwest','west','northwest'][Math.round(b/45)%8];
function direction(b){
  if(S.heading==null) return 'to the '+cardinal(b);
  const rel=((b-S.heading+540)%360)-180, a=Math.abs(rel), side=rel>0?'right':'left';
  if(a<25) return 'straight ahead';
  if(a<70) return 'ahead '+side;
  if(a<110) return 'on your '+side;
  if(a<155) return 'behind '+side;
  return 'behind you';
}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Math.round(n).toLocaleString('en-US');

/* ---------- state ---------- */
const S={
  pos:null,heading:null,src:'none',acc:null,
  listings:new Map(),recs:[],cur:null,mediaIdx:0,
  expanded:false,locked:false,lockT:0,
  fetchCenter:null,fetching:false,offline:false,
  simOn:false,simT:0,simHeading:15,watchId:null,gotFix:false
};

/* =====================================================================
   Demo data (used when no API_URL): procedural photos + sample clips
   ===================================================================== */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}

function scene(kind,hue,seed){
  const r=mulberry32(seed),W=640,H=400;let g='';
  const sky=`<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="hsl(${hue} 42% 20%)"/><stop offset="1" stop-color="hsl(${hue+18} 38% 7%)"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#g)"/>`;
  if(kind==='exterior'){
    g+=`<circle cx="${110+r()*420}" cy="70" r="28" fill="hsl(${hue+40} 80% 78%)" opacity=".22"/>`;
    for(let i=0;i<6;i++){
      const w=92+r()*46,x=-12+i*112+r()*12,h=180+r()*150,y=H-h-30,l=11+r()*9;
      g+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="hsl(${hue+i*6} 22% ${l}%)"/>`;
      for(let wy=y+16;wy<H-52;wy+=34)for(let wx=x+12;wx<x+w-16;wx+=26){
        const on=r()>.55;g+=`<rect x="${wx}" y="${wy}" width="14" height="20" rx="2" fill="${on?'hsl(42 95% 68%)':'hsl('+hue+' 30% 9%)'}"/>`;}
    }
    g+=`<rect y="${H-30}" width="${W}" height="30" fill="hsl(${hue} 14% 7%)"/>`;
  }else{
    g+=`<rect y="${H-96}" width="${W}" height="96" fill="hsl(${hue} 18% 9%)"/>`;
    const wx=44+r()*60;
    g+=`<rect x="${wx}" y="48" width="150" height="170" rx="6" fill="hsl(${hue+160} 55% 62%)" opacity=".34"/>`
      +`<path d="M${wx+75} 48V218M${wx} 133H${wx+150}" stroke="hsl(${hue} 20% 10%)" stroke-width="6"/>`;
    if(kind==='living'){
      g+=`<rect x="260" y="238" width="270" height="86" rx="22" fill="hsl(${hue+10} 30% 24%)"/>`
        +`<rect x="276" y="214" width="238" height="52" rx="18" fill="hsl(${hue+10} 30% 30%)"/>`
        +`<rect x="196" y="322" width="360" height="14" rx="7" fill="hsl(${hue+40} 40% 16%)"/>`
        +`<rect x="574" y="120" width="8" height="216" fill="hsl(${hue} 10% 20%)"/><circle cx="578" cy="112" r="24" fill="hsl(42 95% 68%)" opacity=".55"/>`;
    }else if(kind==='bedroom'){
      g+=`<rect x="230" y="236" width="300" height="102" rx="16" fill="hsl(${hue+20} 28% 22%)"/>`
        +`<rect x="230" y="196" width="300" height="52" rx="12" fill="hsl(${hue+20} 24% 30%)"/>`
        +`<rect x="252" y="214" width="96" height="36" rx="14" fill="hsl(${hue} 20% 60%)" opacity=".55"/>`
        +`<rect x="552" y="262" width="56" height="76" rx="8" fill="hsl(${hue} 18% 16%)"/><circle cx="580" cy="250" r="14" fill="hsl(42 95% 68%)" opacity=".5"/>`;
    }else{ // kitchen
      g+=`<rect x="0" y="40" width="${W}" height="62" fill="hsl(${hue} 20% 16%)"/>`
        +`<rect x="0" y="250" width="${W}" height="88" fill="hsl(${hue} 18% 20%)"/>`
        +`<rect x="0" y="242" width="${W}" height="10" fill="hsl(${hue+30} 30% 34%)"/>`
        +`<rect x="200" y="300" width="300" height="60" rx="8" fill="hsl(${hue} 22% 26%)"/>`
        +`<path d="M260 100V150M350 100V150M440 100V150" stroke="hsl(42 90% 66%)" stroke-width="3" opacity=".7"/>`
        +`<circle cx="260" cy="156" r="12" fill="hsl(42 95% 68%)" opacity=".6"/><circle cx="350" cy="156" r="12" fill="hsl(42 95% 68%)" opacity=".6"/><circle cx="440" cy="156" r="12" fill="hsl(42 95% 68%)" opacity=".6"/>`;
    }
  }
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}">${sky}${g}</svg>`;
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
}

const DEMO_CLIPS=[
  'https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4',
  'https://www.w3schools.com/html/mov_bbb.mp4'
];
const STREETS=['Maple St','Union Ave','Court St','Harbor Row','Elm Terrace','Prospect Pl','Lantern Ln','Cedar Ct','Bell St','Orchard Rd'];
const ADJ=['Sunlit','Renovated','Corner','Garden-level','Top-floor','Loft-style','Quiet','Bright'];
const AMEN=['Dishwasher','Central A/C','Hardwood floors','Roof deck','Gym','Elevator','Doorman','Balcony','Bike storage','Walk-in closet','Storage unit','Fireplace'];
const DESC=[
  'Bright, well kept home a short walk from transit and cafes. Large windows and plenty of closet space.',
  'Recently updated kitchen and bath with new appliances. Quiet block with easy street access.',
  'Open layout with high ceilings and great natural light. Steps from groceries and the park.',
  'Comfortable, efficient floor plan with in-building laundry. Well managed building with a responsive team.'
];
const BASE_PRICE=[2300,3100,4200,5600], BASE_SQFT=[420,640,880,1150];

function demoListings(lat,lng){
  const cell=Math.round(lat*300)+'|'+Math.round(lng*300);
  const rnd=mulberry32(hashStr(cell)), out=[];
  for(let i=0;i<44;i++){
    const p=offset(lat,lng,rnd()*360,500*Math.sqrt(rnd()));
    const beds=[0,1,1,2,2,3][Math.floor(rnd()*6)];
    const street=STREETS[Math.floor(rnd()*STREETS.length)], num=10+Math.floor(rnd()*470);
    const price=Math.round(BASE_PRICE[beds]*(0.78+rnd()*0.5)/25)*25;
    const hue=Math.floor(rnd()*360), seed=Math.floor(rnd()*1e9);
    const amen=[...AMEN].sort(()=>rnd()-.5).slice(0,3+Math.floor(rnd()*3));
    const media=[{type:'photo',src:scene('exterior',hue,seed),label:'Exterior'},
                 {type:'photo',src:scene('living',hue,seed+1),label:'Living room'}];
    if(rnd()>.35) media.push({type:'video',src:DEMO_CLIPS[Math.floor(rnd()*2)],poster:scene('living',hue,seed+9),label:'Video tour'});
    if(beds>0) media.push({type:'photo',src:scene('bedroom',hue,seed+2),label:'Bedroom'});
    media.push({type:'photo',src:scene('kitchen',hue,seed+3),label:'Kitchen'});
    if(rnd()>.6) media.push({type:'video',src:DEMO_CLIPS[Math.floor(rnd()*2)],poster:scene('exterior',hue,seed+8),label:'Walkthrough'});
    out.push({
      id:'demo-'+cell+'-'+i, title:`${ADJ[Math.floor(rnd()*ADJ.length)]} ${beds?beds+' bedroom':'studio'}`,
      address:`${num} ${street}`, lat:p.lat, lng:p.lng, price, beds,
      baths:beds<=1?1:(rnd()>.5?2:1), sqft:Math.round(BASE_SQFT[beds]*(0.85+rnd()*0.3)/5)*5, type:'Apartment',
      available:['Now','Oct 1','Nov 1','Dec 1'][Math.floor(rnd()*4)], lease:'12 mo', deposit:'1 month',
      pets:['Cats OK','Dogs and cats OK','No pets'][Math.floor(rnd()*3)],
      laundry:['In-unit','In building','Nearby'][Math.floor(rnd()*3)], floor:String(1+Math.floor(rnd()*6)),
      parking:['Street','Garage extra','None'][Math.floor(rnd()*3)],
      description:DESC[Math.floor(rnd()*DESC.length)], amenities:amen,
      contact:{name:['Maya R.','Jon T.','Priya S.','Luis M.'][Math.floor(rnd()*4)],phone:`(555) 01${Math.floor(rnd()*10)}-${1000+Math.floor(rnd()*9000)}`},
      media
    });
  }
  return out;
}

/* =====================================================================
   Listings source
   ===================================================================== */
async function fromApi(lat,lng){
  const u=new URL(CONFIG.API_URL,location.href);
  u.searchParams.set('lat',lat.toFixed(6));u.searchParams.set('lng',lng.toFixed(6));u.searchParams.set('radius',CONFIG.FETCH_RADIUS_M);
  const r=await fetch(u,{cache:'no-store'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j=await r.json();
  return (Array.isArray(j)?j:(j.listings||[])).filter(l=>l&&l.id!=null&&isFinite(l.lat)&&isFinite(l.lng)&&isFinite(l.price))
    .map(l=>({...l,id:String(l.id),media:Array.isArray(l.media)&&l.media.length?l.media:[{type:'photo',src:scene('exterior',200,hashStr(String(l.id))),label:'No photos yet'}]}));
}
async function loadListings(){
  if(S.fetching||!S.pos) return;
  S.fetching=true;
  const {lat,lng}=S.pos; S.fetchCenter={lat,lng};
  try{
    const items=CONFIG.API_URL?await fromApi(lat,lng):demoListings(lat,lng);
    S.offline=false;
    items.forEach(l=>S.listings.set(l.id,l));
  }catch(e){ S.offline=true; }
  for(const [id,l] of S.listings){ // drop listings far behind us
    if((!S.cur||S.cur.id!==id)&&dist(S.pos.lat,S.pos.lng,l.lat,l.lng)>1500) S.listings.delete(id);
  }
  S.fetching=false; setGpsChip(); tick();
}

/* =====================================================================
   Location: real GPS (relayed from phone) with simulated-walk fallback
   ===================================================================== */
function onFix(lat,lng,hdg,acc,src){
  if(src==='gps'&&S.simOn) stopSim();
  const prev=S.pos; S.pos={lat,lng}; S.acc=acc; S.src=src;
  if(typeof hdg==='number'&&!isNaN(hdg)) S.heading=hdg;
  else if(prev){const m=dist(prev.lat,prev.lng,lat,lng);
    if(m>4){const b=bearing(prev.lat,prev.lng,lat,lng);S.heading=S.heading==null?b:blendAngle(S.heading,b,.5);}}
  setGpsChip();
  if(!S.fetchCenter||dist(S.fetchCenter.lat,S.fetchCenter.lng,lat,lng)>CONFIG.REFETCH_M) loadListings();
  tick();
}
function startGPS(){
  if(CONFIG.FORCE_SIM||!('geolocation' in navigator)){startSim();return;}
  S.watchId=navigator.geolocation.watchPosition(
    p=>{S.gotFix=true;onFix(p.coords.latitude,p.coords.longitude,p.coords.heading,p.coords.accuracy,'gps');},
    ()=>{ if(!S.gotFix&&!S.simOn) startSim(); },
    {enableHighAccuracy:true,maximumAge:2000,timeout:20000});
  setTimeout(()=>{ if(!S.gotFix&&!S.simOn) startSim(); },10000);
}
function startSim(){
  if(S.simOn) return; S.simOn=true;
  let p=S.pos||CONFIG.SIM_START;
  onFix(p.lat,p.lng,S.simHeading,5,'sim');
  S.simT=setInterval(()=>{
    S.simHeading=(S.simHeading+(Math.random()-.5)*14+360)%360;
    p=offset(p.lat,p.lng,S.simHeading,CONFIG.SIM_SPEED_MPS);
    onFix(p.lat,p.lng,S.simHeading,5,'sim');
  },1000);
}
function stopSim(){ clearInterval(S.simT); S.simOn=false; }

function setGpsChip(){
  let t,warn=false,pulse=false;
  if(!S.pos){t='Locating';warn=true;pulse=true;}
  else if(S.offline){t='Listings offline';warn=true;}
  else if(S.src==='sim'){t='Demo walk';warn=true;}
  else t='GPS'+(S.acc?' ±'+Math.round(S.acc)+' m':'');
  el.gpsTxt.textContent=t;
  el.gps.classList.toggle('warn',warn);el.gps.classList.toggle('pulse',pulse);
}
function setMode(){
  el.modeTxt.textContent=S.locked?'Browsing':'Following';
  el.mode.classList.toggle('warn',S.locked);
}

/* =====================================================================
   Update loop: pick what the card shows
   ===================================================================== */
function recFor(l){return {l,d:dist(S.pos.lat,S.pos.lng,l.lat,l.lng),b:bearing(S.pos.lat,S.pos.lng,l.lat,l.lng)};}
function tick(){
  if(!S.pos) return;
  const recs=[];
  for(const l of S.listings.values()){const r=recFor(l);if(r.d<=CONFIG.RADIUS_M) recs.push(r);}
  recs.sort((a,b)=>a.d-b.d); S.recs=recs;

  const curRec=S.cur?recFor(S.cur):null;
  if(!S.locked&&!S.expanded){
    const best=recs[0];
    if(!best){ if(S.cur) clearCard(); }
    else if(!S.cur) showListing(best);
    else if(best.l.id!==S.cur.id&&(curRec.d>CONFIG.RADIUS_M||best.d+CONFIG.HYSTERESIS_M<curRec.d)) showListing(best);
  }
  updateLive();
  setEmpty();
}
function setEmpty(){
  if(S.cur){el.empty.classList.add('gone');return;}
  el.empty.classList.remove('gone');
  el.emptyTxt.innerHTML=!S.pos?'Finding your location…'
    :S.offline?'Can’t reach listings.<br><b>Retrying as you walk</b>'
    :`No rentals within <b>${fmtDist(CONFIG.RADIUS_M)}</b>.<br>Keep walking`;
}
function updateLive(){
  const n=S.recs.length;
  if(!S.cur){el.countTxt.textContent=n+' nearby';return;}
  const r=recFor(S.cur), i=S.recs.findIndex(x=>x.l.id===S.cur.id);
  el.countTxt.textContent=i>=0?`${i+1} of ${n}`:`${n} nearby`;
  const d=$('dTxt'),w=$('dDir'),a=$('arrow');
  if(d){d.textContent=fmtDist(r.d);w.textContent=direction(r.b);
    a.style.transform=`rotate(${S.heading==null?r.b:((r.b-S.heading+360)%360)}deg)`;}
}

/* =====================================================================
   Rendering
   ===================================================================== */
let io=null;
function showListing(rec){
  const l=rec.l; S.cur=l; S.mediaIdx=0;
  el.sum.innerHTML=`
    <div class="row">
      <div class="price">${money(l.price)}<small>/mo</small></div>
      <div class="where"><div class="txt"><b id="dTxt"></b><em id="dDir"></em></div>
        <div class="compass"><svg id="arrow" viewBox="0 0 24 24"><path d="M12 2 20 21 12 16.5 4 21Z" fill="currentColor"/></svg></div></div>
    </div>
    <div class="specs"><span>${l.beds===0?'Studio':esc(l.beds)+' bd'}</span>${l.baths!=null?`<span>${esc(l.baths)} ba</span>`:''}${l.sqft?`<span>${Number(l.sqft).toLocaleString('en-US')} ft²</span>`:''}${l.type?`<span class="t">${esc(l.type)}</span>`:''}</div>
    <div class="addr">${esc(l.address||l.title||'')}</div>`;
  el.details.innerHTML=detailsHTML(l);
  el.details.scrollTop=0;
  buildMedia(l);
  el.card.classList.remove('hide','in'); void el.card.offsetWidth; el.card.classList.add('in');
  renderHint(); updateLive();
}
function detailsHTML(l){
  const rows=[['Available',l.available],['Lease',l.lease],['Deposit',l.deposit],['Pets',l.pets],['Laundry',l.laundry],['Floor',l.floor],['Parking',l.parking]]
    .filter(r=>r[1]).map(r=>`<div><span>${r[0]}</span>${esc(r[1])}</div>`).join('');
  return `${l.title?`<h3>${esc(l.title)}</h3>`:''}
    ${l.description?`<p>${esc(l.description)}</p>`:''}
    ${rows?`<h3>Details</h3><div class="grid">${rows}</div>`:''}
    ${l.amenities&&l.amenities.length?`<h3>Amenities</h3><div class="tags">${l.amenities.map(a=>`<i>${esc(a)}</i>`).join('')}</div>`:''}
    ${l.contact?`<div class="contact"><span>Leasing contact</span>${esc(l.contact.name||'')} ${esc(l.contact.phone||'')}</div>`:''}`;
}
function buildMedia(l){
  if(io) io.disconnect();
  el.track.innerHTML='';
  l.media.forEach((m,i)=>{
    const s=document.createElement('div'); s.className='slide'; s.dataset.i=i;
    if(m.type==='video'){
      const v=document.createElement('video');
      v.muted=true;v.loop=true;v.playsInline=true;v.preload='metadata';v.setAttribute('playsinline','');
      if(m.poster) v.poster=m.poster;
      v.src=m.src; v.onerror=()=>s.classList.add('bad');
      s.appendChild(v);
    }else{
      const im=new Image(); im.decoding='async'; im.alt=m.label||''; im.src=m.src; s.appendChild(im);
    }
    if(m.label){const c=document.createElement('div');c.className='cap';c.textContent=m.label;s.appendChild(c);}
    el.track.appendChild(s);
  });
  el.track.scrollLeft=0;
  el.dots.innerHTML=l.media.length>1&&l.media.length<=10?l.media.map(()=>'<i></i>').join(''):'';
  io=new IntersectionObserver(es=>es.forEach(e=>{
    const s=e.target,v=s.querySelector('video');
    if(e.isIntersecting&&e.intersectionRatio>=.6){setMedia(+s.dataset.i);if(v)v.play().catch(()=>{});}
    else if(v) v.pause();
  }),{root:el.track,threshold:[.6]});
  [...el.track.children].forEach(s=>io.observe(s));
  setMedia(0);
}
function setMedia(i){
  S.mediaIdx=i; const m=S.cur.media[i], n=S.cur.media.length, vid=m.type==='video';
  el.badge.className='badge'+(vid?' vid':'');
  el.badge.innerHTML=(vid?'<svg viewBox="0 0 12 12"><path d="M2 1 11 6 2 11Z" fill="currentColor"/></svg>':'')+`${i+1}/${n}`;
  [...el.dots.children].forEach((d,k)=>d.classList.toggle('on',k===i));
}
function renderHint(){
  el.hint.innerHTML=S.expanded
    ?'<span><b>◀ ▶</b>Media</span><span><b>▲ ▼</b>Scroll</span><span><b>Back</b>Close</span>'
    :'<span><b>◀ ▶</b>Media</span><span><b>▲ ▼</b>Listings</span><span><b>Pinch</b>Details</span>';
}
function clearCard(){
  S.cur=null; S.expanded=false; el.card.classList.remove('exp'); el.card.classList.add('hide');
  el.track.querySelectorAll('video').forEach(v=>v.pause());
  updateLive();
}

/* =====================================================================
   Input
   ===================================================================== */
function touchInput(){
  S.locked=true; clearTimeout(S.lockT); S.lockT=setTimeout(unlock,CONFIG.LOCK_MS); setMode();
}
function unlock(){
  clearTimeout(S.lockT); S.locked=false;
  if(S.expanded) setExpanded(false);
  setMode(); tick();
}
function bump(axis,rev){
  el.card.classList.remove('bumpx','bumpy','rev'); void el.card.offsetWidth;
  el.card.classList.add(axis==='x'?'bumpx':'bumpy'); if(rev) el.card.classList.add('rev');
}
function media(dir){
  if(!S.cur) return; touchInput();
  const ni=clamp(S.mediaIdx+dir,0,S.cur.media.length-1);
  if(ni===S.mediaIdx){bump('x',dir<0);return;}
  el.track.scrollTo({left:ni*el.track.clientWidth,behavior:'smooth'});
}
function nav(dir){ // dir>0: next (farther) listing, dir<0: previous (nearer)
  if(!S.cur) return;
  if(S.expanded){touchInput();el.details.scrollBy({top:dir*150,behavior:'smooth'});return;}
  const i=S.recs.findIndex(r=>r.l.id===S.cur.id);
  const ni=clamp((i<0?0:i)+dir,0,S.recs.length-1);
  if(!S.recs.length||ni===i){bump('y');return;}
  touchInput(); showListing(S.recs[ni]);
}
function setExpanded(on){
  S.expanded=on; el.card.classList.toggle('exp',on); renderHint();
  if(on) touchInput(); else el.details.scrollTop=0;
}
let lastToggle=0;
function toggleDetails(){
  const n=performance.now(); if(n-lastToggle<350) return; lastToggle=n; // pinch may arrive as keydown + click
  if(!S.cur) return; setExpanded(!S.expanded);
}
function back(){
  if(S.expanded){setExpanded(false);return;}
  if(S.locked){unlock();return;}
  bump('y');
}

document.addEventListener('keydown',e=>{
  switch(e.key){
    case 'ArrowLeft':  e.preventDefault();media(-1);break;
    case 'ArrowRight': e.preventDefault();media(1);break;
    case 'ArrowUp':    e.preventDefault();nav(-1);break;
    case 'ArrowDown':  e.preventDefault();nav(1);break;
    case 'Enter': case ' ': e.preventDefault();toggleDetails();break;
    case 'Escape': case 'Backspace': e.preventDefault();back();break;
    case 's': case 'S': if(S.simOn){stopSim();}else{startSim();} break; // desktop testing
  }
});
el.card.addEventListener('click',toggleDetails);

let wheelT=0;
addEventListener('wheel',e=>{
  e.preventDefault(); const n=performance.now(); if(n-wheelT<280) return; wheelT=n;
  if(Math.abs(e.deltaX)>Math.abs(e.deltaY)) media(e.deltaX>0?1:-1); else nav(e.deltaY>0?1:-1);
},{passive:false});

// pointer swipe fallback for the lower half of the card (no pointer capture)
(()=>{let x0=0,y0=0,on=false;
  el.card.addEventListener('pointerdown',e=>{x0=e.clientX;y0=e.clientY;on=true;});
  el.card.addEventListener('pointerup',e=>{
    if(!on) return; on=false;
    const dx=e.clientX-x0,dy=e.clientY-y0;
    if(Math.abs(dy)>50&&Math.abs(dy)>Math.abs(dx)*1.5) nav(dy<0?1:-1);
    else if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5) media(dx<0?1:-1);
  });
  el.card.addEventListener('pointercancel',()=>{on=false;});
})();

// keep the glasses focus engine parked on the card
addEventListener('load',()=>el.card.focus({preventScroll:true}));
document.addEventListener('visibilitychange',()=>{ if(document.hidden) el.track.querySelectorAll('video').forEach(v=>v.pause()); });

/* ---------- go ---------- */
setGpsChip(); setMode(); renderHint(); startGPS();
})();
</script>
</body>
</html>
